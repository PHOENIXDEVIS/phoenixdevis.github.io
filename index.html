<div class="cancer-intro">

<h3>Understanding Anticancer Therapy</h3>

<p>
Anticancer medicines are drugs used to treat malignant diseases.
They may act by damaging DNA, blocking cell division, interfering
with hormone signalling, inhibiting specific molecular targets,
stimulating the immune system, or delivering toxic substances
selectively to cancer cells.
</p>

<br>

<p>
Cancer treatment is highly individualised. The selected medicine,
dose, treatment cycle and combination depend on the cancer type,
stage, molecular characteristics, organ function, previous therapy,
patient factors and treatment protocol.
</p>

</div>

<div class="grid" id="anticancerGrid"></div>

<div class="warning">

<strong>Important clinical safety notice:</strong>

The doses shown in this educational database are NOT universal
prescriptions. Many anticancer medicines require specialist
oncology protocols, body-surface-area or weight-based calculations,
renal/hepatic adjustment, laboratory monitoring and combination
regimens. Patients should never start, stop or change anticancer
therapy without their oncology/medical team.

</div>

</div>

</section>
